name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No secrets committed
        run: |
          if git ls-files --error-unmatch include/secrets.h >/dev/null 2>&1; then
            echo "::error file=include/secrets.h::secrets.h must not be committed"; exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Python tools compile
        run: python -m py_compile tools/*.py

  test:
    name: Unit tests (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install PlatformIO
        run: pip install -U platformio
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-native-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Run tests
        run: pio test -e native -v

  build:
    name: Firmware (${{ matrix.lang }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [EN, RU]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/workflows/ci.yml
      - name: Install PlatformIO
        run: pip install -U platformio
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-cyd-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Build
        env:
          PLATFORMIO_BUILD_FLAGS: -DUI_LANG=UI_LANG_${{ matrix.lang }}
        run: pio run -e cyd
      - name: Size report
        run: |
          pio run -e cyd -t size | tail -n 4 | tee size.txt
          { echo "### Firmware ${{ matrix.lang }}"; echo '```'; cat size.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          PLATFORMIO_BUILD_FLAGS: -DUI_LANG=UI_LANG_${{ matrix.lang }}
      - name: Collect binaries
        run: |
          d=.pio/build/cyd
          mkdir -p dist
          cp $d/firmware.bin dist/cyd-jk-bms-${{ matrix.lang }}.bin
          # Single image for a blank board: flash at 0x0.
          pio pkg exec -p tool-esptoolpy -- esptool.py --chip esp32 merge_bin \
            -o dist/cyd-jk-bms-${{ matrix.lang }}-full.bin \
            --flash_mode dio --flash_size 4MB \
            0x1000 $d/bootloader.bin 0x8000 $d/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $d/firmware.bin
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.lang }}
          path: dist/*.bin
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.bin
          generate_release_notes: true
