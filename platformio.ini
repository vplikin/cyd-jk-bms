; ESP32-2432S028R (CYD): JK BMS + EPEVER MPPT monitor over BLE
[platformio]
default_envs = cyd

[env:cyd]
platform = espressif32 @ ~6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 600000
board_build.partitions = min_spiffs.csv

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d
  lvgl/lvgl@~8.4.0
  h2zero/NimBLE-Arduino@~1.4.3

build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9341_DRIVER=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DTOUCH_CS=33
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  -DSPI_TOUCH_FREQUENCY=2500000
  -DUSE_HSPI_PORT
  ; No TFT_eSPI fonts: all text is drawn by LVGL.
  -DLV_CONF_INCLUDE_SIMPLE
  -I include
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=3
  -DCONFIG_NIMBLE_CPP_ENABLE_GC_HEAP_DEBUG=0

; Host-side unit tests for the pure logic (frame decoder, alarms, summary).
; Run: pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<ble/jk_frame_decoder.cpp> +<model/pack_summary.cpp>
build_flags =
  -std=gnu++17
  -I include
  -DCYD_NO_SECRETS
  -Wall
  -Wextra
